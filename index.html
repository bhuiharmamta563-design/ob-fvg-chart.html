<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Delta Exchange Trading Bot with Auto Signals</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lightweight Charts -->
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        /* Focus / Fullscreen Mode Styles */
        .fullscreen-mode {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 9999 !important;
            background: #0f172a !important;
            padding: 15px !important;
            display: flex;
            flex-direction: column;
        }
        .fullscreen-mode #chart-container {
            flex-grow: 1 !important;
            height: auto !important;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
        }
    </style>
</head>
<body class="p-2 sm:p-4">

    <!-- Main Container -->
    <div id="dashboard-container" class="max-w-7xl mx-auto space-y-4">
        
        <!-- Header & Controls -->
        <header class="flex flex-wrap justify-between items-center bg-slate-800 p-3 rounded-xl border border-slate-700 gap-3">
            <div>
                <h1 class="text-lg sm:text-xl font-bold text-emerald-400">Delta Live Terminal + Signals</h1>
                <p class="text-xs text-slate-400">Orderbook Reversal & Auto-Signal Engine</p>
            </div>
            
            <div class="flex items-center gap-2">
                <select id="symbol-select" class="bg-slate-900 border border-slate-700 text-white text-sm rounded-lg px-3 py-1.5 focus:outline-none focus:border-emerald-500">
                    <option value="BTCUSDT">BTC-PERP</option>
                    <option value="ETHUSDT">ETH-PERP</option>
                </select>
                <!-- Fullscreen / Focus Toggle Button -->
                <button id="fullscreen-btn" onclick="toggleFullscreen()" class="bg-emerald-600 hover:bg-emerald-500 text-xs px-3 py-2 rounded-lg font-bold text-white transition">
                    ⛶ Focus / Fullscreen
                </button>
            </div>
        </header>

        <!-- Main Workspace (Grid) -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
            
            <!-- Chart Section -->
            <div id="chart-card" class="lg:col-span-2 bg-slate-800 p-3 rounded-xl border border-slate-700 flex flex-col h-[450px] sm:h-[550px]">
                <div class="flex justify-between items-center mb-2 px-1">
                    <span class="text-sm font-semibold text-slate-300">Live Chart & Signal Markers</span>
                    <span id="live-price" class="text-sm font-bold text-emerald-400 animate-pulse">Loading...</span>
                </div>
                <!-- Chart Container with Touch Pinch-to-Zoom Enabled -->
                <div id="chart-container" class="w-full flex-grow touch-none relative rounded-lg overflow-hidden"></div>
            </div>

            <!-- Orderbook & Signal Panel Section -->
            <div class="bg-slate-800 p-3 rounded-xl border border-slate-700 flex flex-col h-[420px] lg:h-[550px]">
                <h2 class="text-sm font-semibold text-slate-300 mb-2">Orderbook & Signal Status</h2>
                
                <!-- Live Signal Badge Box -->
                <div id="signal-badge" class="p-2.5 mb-3 rounded-lg text-center font-bold text-xs uppercase tracking-wider bg-slate-900 border border-slate-700 text-yellow-400">
                    Analysing Orderbook Pressure...
                </div>

                <div class="grid grid-cols-2 text-xs font-semibold text-slate-400 pb-1 border-b border-slate-700">
                    <span>Price (USDT)</span>
                    <span class="text-right">Size (Qty)</span>
                </div>
                
                <!-- Orderbook List -->
                <div id="orderbook-list" class="flex-grow overflow-y-auto space-y-1 mt-2 text-xs font-mono">
                    <div class="text-center text-slate-500 py-10">Connecting...</div>
                </div>

                <!-- Emergency Kill Switch & Action Bar -->
                <div class="mt-3 pt-3 border-t border-slate-700 flex gap-2">
                    <button onclick="triggerBuy()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-lg text-xs transition">BUY / LONG</button>
                    <button onclick="triggerSell()" class="flex-1 bg-rose-600 hover:bg-rose-500 text-white font-bold py-2 rounded-lg text-xs transition">SELL / SHORT</button>
                    <button onclick="emergencyStop()" class="bg-red-700 hover:bg-red-600 px-3 text-white font-bold rounded-lg text-xs" title="Emergency Stop">🛑</button>
                </div>
            </div>

        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // 1. Initialize Chart with Pinch-to-Zoom enabled for mobile
        const chartContainer = document.getElementById('chart-container');
        const chart = LightweightCharts.createChart(chartContainer, {
            layout: {
                background: { type: 'solid', color: '#090d16' },
                textColor: '#94a3b8',
            },
            grid: {
                vertLines: { color: '#1e293b' },
                horzLines: { color: '#1e293b' },
            },
            timeScale: { 
                timeVisible: true, 
                secondsVisible: false 
            },
            handleScroll: { 
                mouseWheel: true, 
                pressedMouseMove: true, 
                horzTouchDrag: true, 
                vertTouchDrag: true 
            },
            handleScale: { 
                axisPressedMouseMove: true, 
                mouseWheel: true, 
                pinch: true // Yeh mobile par do ungliyon se zoom in/out karne ke liye hai
            },
        });

        const candlestickSeries = chart.addCandlestickSeries({
            upColor: '#10b981', 
            downColor: '#f43f5e', 
            borderVisible: false,
            wickUpColor: '#10b981', 
            wickDownColor: '#f43f5e',
        });

        // Base Chart Data
        let chartData = [
            { time: 1718000000, open: 67100, high: 67350, low: 66950, close: 67200 },
            { time: 1718003600, open: 67200, high: 67500, low: 67150, close: 67450 },
            { time: 1718007200, open: 67450, high: 67600, low: 67300, close: 67350 },
            { time: 1718010800, open: 67350, high: 67400, low: 67000, close: 67050 },
            { time: 1718014400, open: 67050, high: 67250, low: 66900, close: 67180 }
        ];
        candlestickSeries.setData(chartData);

        // Auto resize chart on window change
        window.addEventListener('resize', () => {
            chart.applyOptions({ width: chartContainer.clientWidth, height: chartContainer.clientHeight });
        });

        // 2. Fullscreen / Focus Mode Toggle Functionality
        function toggleFullscreen() {
            const card = document.getElementById('chart-card');
            const btn = document.getElementById('fullscreen-btn');
            card.classList.toggle('fullscreen-mode');
            
            if (card.classList.contains('fullscreen-mode')) {
                btn.innerText = "✕ Exit Focus";
            } else {
                btn.innerText = "⛶ Focus / Fullscreen";
            }

            // Resize chart properly after layout shift
            setTimeout(() => {
                chart.applyOptions({ width: chartContainer.clientWidth, height: chartContainer.clientHeight });
            }, 100);
        }

        // 3. Orderbook & Automatic Signal Logic
        function updateOrderbookAndSignals() {
            const list = document.getElementById('orderbook-list');
            const badge = document.getElementById('signal-badge');
            let html = '';
            
            let totalAskQty = 0;
            let totalBidQty = 0;
            
            let asksHTML = '';
            for(let i=5; i>=1; i--) {
                let price = (67050 + i * 15).toFixed(2);
                let qty = parseFloat((Math.random() * 2).toFixed(4));
                totalAskQty += qty;
                asksHTML += `<div class="flex justify-between text-rose-400 py-0.5 px-1 bg-rose-950/20 rounded">
                    <span>${price}</span>
                    <span class="text-right">${qty}</span>
                </div>`;
            }

            let bidsHTML = '';
            for(let i=1; i<=5; i++) {
                let price = (67050 - i * 15).toFixed(2);
                let qty = parseFloat((Math.random() * 2).toFixed(4));
                totalBidQty += qty;
                bidsHTML += `<div class="flex justify-between text-emerald-400 py-0.5 px-1 bg-emerald-950/20 rounded">
                    <span>${price}</span>
                    <span class="text-right">${qty}</span>
                </div>`;
            }

            html = asksHTML + `<div class="text-center py-1 text-slate-400 font-bold border-y border-slate-700 my-1">SPREAD</div>` + bidsHTML;
            list.innerHTML = html;
            document.getElementById('live-price').innerText = "₹ 67,050.00";

            // Signal Generation based on Bid/Ask Imbalance
            let markers = [];
            if (totalBidQty > totalAskQty * 1.2) {
                badge.className = "p-2.5 mb-3 rounded-lg text-center font-bold text-xs uppercase tracking-wider bg-emerald-950 border border-emerald-600 text-emerald-400 animate-pulse";
                badge.innerText = "🟢 SIGNAL: STRONG BUY (Support Wall Active)";
                
                markers.push({
                    time: chartData[chartData.length - 1].time,
                    position: 'belowBar',
                    color: '#10b981',
                    shape: 'arrowUp',
                    text: 'BUY',
                });
            } else if (totalAskQty > totalBidQty * 1.2) {
                badge.className = "p-2.5 mb-3 rounded-lg text-center font-bold text-xs uppercase tracking-wider bg-rose-950 border border-rose-600 text-rose-400 animate-pulse";
                badge.innerText = "🔴 SIGNAL: STRONG SELL (Resistance Wall Active)";
                
                markers.push({
                    time: chartData[chartData.length - 1].time,
                    position: 'aboveBar',
                    color: '#f43f5e',
                    shape: 'arrowDown',
                    text: 'SELL',
                });
            } else {
                badge.className = "p-2.5 mb-3 rounded-lg text-center font-bold text-xs uppercase tracking-wider bg-slate-900 border border-slate-700 text-yellow-400";
                badge.innerText = "⚪ NEUTRAL: Market Consolidating";
            }

            candlestickSeries.setMarkers(markers);
        }

        setInterval(updateOrderbookAndSignals, 3000);
        updateOrderbookAndSignals();

        function triggerBuy() { alert("Manual Buy Order Executed!"); }
        function triggerSell() { alert("Manual Sell Order Executed!"); }
        function emergencyStop() { alert("⚠️ Emergency Kill Switch Activated! All positions closed."); }
    </script>
</body>
</html>
